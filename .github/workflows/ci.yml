name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege: read-only by default, write access only where a job needs it.
permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Vet and test
        working-directory: server
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # build number = commit count
          persist-credentials: false

      - name: Test
        run: swift test --package-path app

      - name: Build universal app
        run: scripts/build-app.sh --universal

      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent AmbientLight.app AmbientLight.zip
          shasum -a 256 AmbientLight.zip > AmbientLight.zip.sha256
          cat AmbientLight.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AmbientLight
          path: build/AmbientLight.zip*

  image:
    needs: server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [app, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AmbientLight

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          AmbientLight.zip AmbientLight.zip.sha256
          --repo "$GITHUB_REPOSITORY" --title "AmbientLight $GITHUB_REF_NAME" --generate-notes
